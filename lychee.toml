# lychee configuration for the external links of the Markdown documents (.github/workflows/docs-lint.yml).
# Relative links and anchors are not checked here: the VitePress build (pages.yml) fails on dead internal links.

# Only web links; mailto:, file: and other schemes are not fetched.
scheme = ["http", "https"]

# Ignore links to the local machine (http://localhost:5173 and the like in the docs).
exclude_loopback = true

exclude = [
  # The documentation site is not live yet (Settings → Pages is switched on later); the URL is in the README and the docs.
  '^https://gravionlabs\.github\.io/herdr-plugins/',
  # Links to files of this repo on main that are not there yet: release/next content reaches main only with the
  # release PR. Local file links are checked by the VitePress build (pages.yml), so nothing is lost here.
  '^https://github\.com/GravionLabs/herdr-plugins/blob/main/',
]

# Status codes that do not mean a dead link: 403 and 429 are what GitHub, npm and docs hosts return to
# anonymous CI runners (rate limits and bot protection). Real 404s and 5xx still fail the job.
accept = ["200", "201", "202", "203", "204", "206", "301", "302", "303", "307", "308", "403", "429"]

timeout = 20
max_retries = 3
retry_wait_time = 5
max_concurrency = 8
