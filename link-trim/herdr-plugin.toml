id = "link-trim"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Opens links without the trailing punctuation that URL detection picks up"

[[actions]]
id = "open"
title = "Open link without trailing punctuation"
command = ["node", "bin/open.mjs"]

[[link_handlers]]
id = "trailing-punct"
title = "Open link without trailing punctuation"
pattern = "^https?://[^\\s]*[)\\].,;:'\"]$"
action = "open"
