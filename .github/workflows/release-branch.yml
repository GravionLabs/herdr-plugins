# Pushes to a release branch, handled by the reusable workflow release-branch.yml of GravionLabs/ci: keeps the release PR
# open and current, labels the issues merged into the branch `merged`, sets the project Status `In release` and syncs
# the project field Needs. project-url is project 17 of GravionLabs.
# GH_PAT: classic PAT with scope `repo` (a PR created with the GITHUB_TOKEN triggers no required checks).
# PROJECT_TOKEN (optional): classic PAT with scope `project`, falls back to GH_PAT.
name: Release branch

on:
  push:
    branches: ['release/**']

permissions: {}

jobs:
  release-branch:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: GravionLabs/ci/.github/workflows/release-branch.yml@v1
    with:
      project-url: https://github.com/users/GravionLabs/projects/17
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
