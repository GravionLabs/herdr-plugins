name: Pages

# The documentation site (apps/site, VitePress; pages are the files of docs/).
# Pull requests that touch the site or its documents build it, so a dead link is found before the merge.
# Deploying to GitHub Pages is added later (#96) and stays behind the repository variable DEPLOY_PAGES.
on:
  pull_request:
    branches: [main, 'release/**']
    paths:
      - 'apps/site/**'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    env:
      SITE_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      # Dead links fail this step.
      - name: Build the documentation site
        run: npm run docs:build
