id = "deliver-board"
name = "deliver-board"
version = "0.6.0"
min_herdr_version = "0.9.5"
platforms = ["macos", "linux"]
description = "Popup with the open PBIs, claims and PR state of release/next"

[[actions]]
id = "open"
title = "Open the deliver board"
command = ["node", "bin/open.ts"]

[[actions]]
id = "data"
title = "Print the deliver board as JSON"
command = ["node", "bin/data.ts"]

[[panes]]
id = "board"
title = "Deliver board"
placement = "popup"
width = "90%"
height = "70%"
command = ["node", "bin/board.ts"]
